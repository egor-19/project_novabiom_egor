<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Создание набора</title>
</head>
<body>
    <h1>Создание набора</h1>

    <form method="post">
        <p>
            <label for="serial_number">Серийный номер</label>
            <input type="text" id="serial_number" name="serial_number" value="{{ saved_serial_number }}" required>
        </p>
        {% if text_error_1 %}
        <p>{{ text_error_1 }}</p>
        {% endif %}
        <p>
            <label for="client_name">Имя клиента</label>
            <input type="text" id="client_name" name="client_name" value="{{ saved_client_name }}" required>
        </p>
        {% if text_error_2 %}
        <p>{{ text_error_2 }}</p>
        {% endif %}
        <button type="submit">Сохранить</button>
    </form>
</body>
</html>
